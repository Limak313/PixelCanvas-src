name: Release

# 发布打包：打 tag（v*）或手动触发时，Windows 环境先过构建+无头测试门禁，
# 再产出自包含部署包 zip 与插件包 zip，并创建 GitHub Release 上传资产。
# 桌面与实时画布宿主仍为 net10.0-windows + WinForms；Core 与 MCP 为 net10.0。
# 门禁排除 [Trait("Category","UI")] 的交互式冒烟用例（依赖桌面会话，在本机用 -Ui 手动执行）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Build, Package & Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Release build & headless tests (gate)
        run: |
          dotnet format whitespace PixelCanvas.slnx --verify-no-changes
          dotnet build PixelCanvas.slnx -c Release --nologo -warnaserror
          dotnet test PixelCanvas.slnx -c Release --no-build --nologo --filter "Category!=UI"

      - name: Package deployment zips (x64 + arm64)
        shell: pwsh
        run: |
          .\打包本地MCP.ps1 -Mode All -Rid win-x64
          .\打包本地MCP.ps1 -Mode All -Rid win-arm64 -NoPlugin

      - name: Package installers (x64 + arm64)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          .\安装包\生成安装包.ps1 -PackageRoot "PixelCanvas-Agent-$version-win-x64" -Rid win-x64
          .\安装包\生成安装包.ps1 -PackageRoot "PixelCanvas-Agent-$version-win-arm64" -Rid win-arm64

      - name: Package plugin zip
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          Compress-Archive -Path pixelcanvas-plugin\* -DestinationPath "pixelcanvas-plugin-$version.zip" -Force

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tag = $env:GITHUB_REF_NAME
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?s)##\s*\[$([regex]::Escape($version))\].*?(?=\n##\s*\[|\z)").Value.Trim()
          if (-not $section) { $section = "## [$version]" + [Environment]::NewLine + [Environment]::NewLine + "见 CHANGELOG。" }
          $assets = [Environment]::NewLine + [Environment]::NewLine + "---" + [Environment]::NewLine + `
            "Windows x64 / arm64：``PixelCanvas-$version-win-x64-setup.exe`` 与 ``PixelCanvas-$version-win-arm64-setup.exe`` 为自包含安装包（各约 52 MB，无需预装 .NET，安装到当前用户目录并创建开始菜单与桌面快捷方式）；``PixelCanvas-$version-<rid>-slim.zip`` 为免安装精简包（需对应架构的 .NET 10 桌面运行时）；``PixelCanvas-Agent-$version-<rid>.zip`` 为自包含免安装包；``pixelcanvas-plugin-$version.zip`` 为 Agent 插件（x64）。无头核心测试、Linux MCP 冒烟、覆盖率下限与格式门禁已在 CI 通过。"
          Set-Content release-notes.md ($section + $assets) -Encoding utf8
          gh release create $tag `
            --title "PixelCanvas $version" `
            --notes-file release-notes.md `
            "PixelCanvas-$version-win-x64-setup.exe" `
            "PixelCanvas-$version-win-arm64-setup.exe" `
            "PixelCanvas-$version-win-x64-slim.zip" `
            "PixelCanvas-$version-win-arm64-slim.zip" `
            "PixelCanvas-Agent-$version-win-x64.zip" `
            "PixelCanvas-Agent-$version-win-arm64.zip" `
            "pixelcanvas-plugin-$version.zip"
