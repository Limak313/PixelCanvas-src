name: CI

# 持续集成门禁：Windows 全量构建与测试，另加 Linux 核心构建，确认 Core/MCP 不依赖 Windows。
# 桌面与实时画布宿主仍为 net10.0-windows + WinForms；Core 与 MCP 为 net10.0。
# UI 冒烟用例标记 [Trait("Category","UI")]，依赖交互式桌面，门禁中用 --filter "Category!=UI" 排除。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Release Build & Headless Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore PixelCanvas.slnx --nologo

      - name: Verify formatting
        run: dotnet format whitespace PixelCanvas.slnx --verify-no-changes --no-restore

      - name: Release build (warnings as errors)
        run: dotnet build PixelCanvas.slnx -c Release --no-restore --nologo -warnaserror

      - name: Run headless tests (UI group excluded, coverage on)
        run: >-
          dotnet test PixelCanvas.slnx
          -c Release --no-build --nologo
          --filter "Category!=InteractiveUI"
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --logger "trx;LogFileName=pixelcanvas-tests.trx"

      - name: Cross-build Windows arm64 self-contained bundle
        shell: pwsh
        run: .\打包本地MCP.ps1 -Mode Bundle -Rid win-arm64 -NoPlugin

      - name: Build coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator "-reports:coverage/**/coverage.cobertura.xml" "-targetdir:coverage/report" -reporttypes:"Html;Cobertura"

      - name: Enforce coverage floor (55% lines / 38% branches)
        if: always()
        shell: pwsh
        run: |
          $merged = Join-Path coverage 'report/Cobertura.xml'
          $xmlFile = if (Test-Path $merged) { Get-Item $merged } else { Get-ChildItem coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1 }
          if (-not $xmlFile) { throw '没有生成覆盖率报告，无法校验下限。' }
          [xml]$cov = Get-Content -LiteralPath $xmlFile.FullName
          $line = [double]$cov.coverage.'line-rate'
          $branch = [double]$cov.coverage.'branch-rate'
          Write-Host ("覆盖率：行 {0:N1}%，分支 {1:N1}%" -f ($line * 100), ($branch * 100))
          if ($line -lt 0.55) { throw "行覆盖率低于 55% 下限：$([math]::Round($line * 100, 1))%" }
          if ($branch -lt 0.38) { throw "分支覆盖率低于 38% 下限：$([math]::Round($branch * 100, 1))%" }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: PixelCanvas.Tests/TestResults/*.trx
          retention-days: 14

      - name: Upload Release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: |
            PixelCanvas/bin/Release/net10.0-windows/
            PixelCanvas.Mcp/bin/Release/net10.0/
          retention-days: 14

  core-linux:
    name: Linux Core Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build Core, MCP and core tests
        run: >-
          dotnet build PixelCanvas.Core.Tests/PixelCanvas.Core.Tests.csproj
          -c Release --nologo -warnaserror

      - name: Run core tests (no UI)
        run: >-
          dotnet test PixelCanvas.Core.Tests/PixelCanvas.Core.Tests.csproj
          -c Release --no-build --nologo

      - name: MCP stdio smoke (file tools + PNG export)
        run: >-
          python .github/mcp-smoke.py
          PixelCanvas.Mcp/bin/Release/net10.0/PixelCanvas.Mcp.dll
