name: CI

# 持续集成门禁：Windows 环境 Release 全量构建 + 无头核心测试。
# 三个项目目标框架均为 net10.0-windows 且启用 WinForms，必须使用 Windows runner。
# 9 组 UI 冒烟用例默认带 [Fact(Skip=...)]，不在无头或 CI 环境运行。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Release Build & Headless Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Release build solution
        run: dotnet build PixelCanvas.slnx -c Release --nologo

      - name: Run headless tests (UI smoke cases are skipped)
        run: >-
          dotnet test PixelCanvas.Tests/PixelCanvas.Tests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=pixelcanvas-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: PixelCanvas.Tests/TestResults/*.trx
          retention-days: 14

      - name: Upload Release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            PixelCanvas/bin/Release/net10.0-windows/
            PixelCanvas.Mcp/bin/Release/net10.0-windows/
          retention-days: 14
