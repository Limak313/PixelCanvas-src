version: 2

# 依赖更新机器人：NuGet 包与 GitHub Actions 分两条生态，各自按周聚合成一个 PR，避免刷屏。
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "nuget"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
